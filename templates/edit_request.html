<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<title>Edit Request - Murang'a PSB</title>
<style>:root{--green:#0a5c26;--gold:#FFD54F} body{background:#f6f9f6;font-family:'Segoe UI'} .card-m{background:#fff;border-radius:16px;border:1px solid #e8eee8;box-shadow:0 10px 24px rgba(0,0,0,.06)}</style>
</head><body>
<div class="container py-4" style="max-width:700px">
<a href="/dashboard" class="text-decoration-none small mb-3 d-inline-block" style="color:#0a5c26"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
<div class="card-m p-4">
<h4 class="fw-bold mb-3"><i class="bi bi-pencil-square" style="color:#0a5c26"></i> Edit Service Request #{{ req['id'] }}</h4>
<form method="POST">
<label class="fw-semibold small mt-2">Category</label>
<select name="category" class="form-select" required>
<option value="{{ req['category'] }}" selected>{{ req['category'] }} (current)</option>
<option>Water Issue</option><option>Road Damage</option><option>Garbage Collection</option><option>Street Lighting</option><option>Health Service</option><option>General</option>
</select>
<label class="fw-semibold small mt-3">Location / Ward</label>
<input name="location" value="{{ req['location'] }}" class="form-control" required>
<label class="fw-semibold small mt-3">Description</label>
<textarea name="description" class="form-control" rows="4" required>{{ req['description'] }}</textarea>
<div class="d-flex gap-2 mt-4">
<button class="btn px-4" style="background:#0a5c26;color:#fff;font-weight:700;border-radius:10px"><i class="bi bi-check-lg"></i> Save Changes</button>
<a href="/dashboard" class="btn btn-light border">Cancel</a>
</div>
</form>
</div>
<div class="text-center mt-3"><small class="text-muted">Developed by soloh_kim • Murang'a PSB</small></div>
</div>
</body></html>
