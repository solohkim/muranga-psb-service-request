<!DOCTYPE html>
<html><head><title>Forgot Password - Murang'a PSB</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:450px;">
<div class="card p-4 shadow">
<h4 class="text-center mb-3">🔑 Reset Password</h4>
{% with messages = get_flashed_messages(with_categories=true) %}
{% for cat, msg in messages %}<div class="alert alert-{{cat}}">{{msg}}</div>{% endfor %}{% endwith %}
<form method="POST">
<input type="email" name="email" class="form-control mb-3" placeholder="Enter registered email" required>
<input type="password" name="new_password" class="form-control mb-3" placeholder="New Password (min 6 chars)" required>
<input type="password" name="confirm_password" class="form-control mb-3" placeholder="Confirm New Password" required>
<button class="btn btn-success w-100">Reset Password</button>
</form>
<div class="text-center mt-3"><a href="/login">Back to Login</a></div>
</div>
<div class="text-center mt-3" style="font-size:12px; color:#555;">
© {{ copyright_year }} Murang'a PSB eService Portal<br>Developed by {{ developer_name }}
</div>
</div></body></html>
